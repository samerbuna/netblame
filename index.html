<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net Monitor</title>
<link rel="icon" id="favicon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --idle: #898781;
    --on-good: #ffffff;
    --on-warning: #0b0b0b;
    --on-critical: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--ink-2); }

  /* status hero */
  .hero { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .orb {
    width: 76px; height: 76px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 36px; font-weight: 700;
    background: var(--idle); color: #fff;
    flex: none;
    transition: background-color .2s;
  }
  [data-status="up"] .orb { background: var(--good); color: var(--on-good); }
  [data-status="warn"] .orb { background: var(--warning); color: var(--on-warning); }
  [data-status="down"] .orb { background: var(--critical); color: var(--on-critical); }
  [data-status="down"] .orb { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--critical) 22%, transparent); } }
  @media (prefers-reduced-motion: reduce) { [data-status="down"] .orb { animation: none; } }
  .hero-text { min-width: 0; flex: 1; }
  .hero-label { font-size: 30px; font-weight: 700; line-height: 1.1; margin: 0; }
  .hero-reason { color: var(--ink-2); margin-top: 4px; }
  .hero-since { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* layer checks */
  .layers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  .layer { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  .layer-name { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .layer-name .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
  .layer[data-ok="1"] .dot { background: var(--good); }
  .layer[data-ok="0"] .dot { background: var(--critical); }
  .layer-value { font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layer-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* filter row */
  .filters { display: flex; gap: 4px; margin: 24px 0 12px; flex-wrap: wrap; }
  .filters button {
    font: inherit; font-size: 13px;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    cursor: pointer;
  }
  .filters button:hover { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .tile-label { font-size: 12px; color: var(--ink-2); }
  .tile-value { font-size: 26px; font-weight: 650; margin-top: 2px; }
  .tile-unit { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .tile-sub { font-size: 12px; color: var(--muted); }

  /* chart */
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .chart-head h2 { margin: 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
  .key-band { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart-wrap { position: relative; }
  #chart { display: block; width: 100%; height: 240px; touch-action: none; }
  #chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .tooltip {
    position: absolute; top: 0; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
    padding: 8px 10px; font-size: 12px; min-width: 150px;
    display: none;
  }
  .tooltip .tt-time { color: var(--ink-2); margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 6px; }
  .tooltip .tt-row strong { font-variant-numeric: tabular-nums; }
  .tooltip .tt-row span.name { color: var(--ink-2); }

  /* tables */
  .section { margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .empty { color: var(--muted); padding: 8px 0; }
  .badge { display: inline-flex; align-items: center; gap: 6px; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .badge[data-s="up"]::before { background: var(--good); }
  .badge[data-s="warn"]::before { background: var(--warning); }
  .badge[data-s="down"]::before { background: var(--critical); }
  details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  details[open] summary { margin-bottom: 8px; }
  .table-scroll { overflow-x: auto; }
  footer { margin-top: 16px; font-size: 12px; color: var(--muted); }

  @media (max-width: 720px) {
    .layers, .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero-label { font-size: 24px; }
  }
</style>
</head>
<body>
<main>
  <section class="card" id="hero" data-status="idle" aria-live="polite">
    <div class="hero">
      <div class="orb" id="orb" aria-hidden="true">…</div>
      <div class="hero-text">
        <p class="hero-label" id="label">Connecting…</p>
        <div class="hero-reason" id="reason">Waiting for the local monitor</div>
        <div class="hero-since" id="since"></div>
      </div>
    </div>
    <div class="layers">
      <div class="layer" id="layer-router">
        <div class="layer-name"><span class="dot"></span>Router</div>
        <div class="layer-value">—</div><div class="layer-sub"></div>
      </div>
      <div class="layer" id="layer-internet">
        <div class="layer-name"><span class="dot"></span>Internet ping</div>
        <div class="layer-value">—</div><div class="layer-sub"></div>
      </div>
      <div class="layer" id="layer-dns">
        <div class="layer-name"><span class="dot"></span>DNS</div>
        <div class="layer-value">—</div><div class="layer-sub"></div>
      </div>
      <div class="layer" id="layer-web">
        <div class="layer-name"><span class="dot"></span>Web (HTTP)</div>
        <div class="layer-value">—</div><div class="layer-sub"></div>
      </div>
    </div>
  </section>

  <div class="filters" role="group" aria-label="Time range">
    <button type="button" data-range="900000">15 min</button>
    <button type="button" data-range="3600000">1 hour</button>
    <button type="button" data-range="21600000">6 hours</button>
    <button type="button" data-range="86400000">24 hours</button>
  </div>

  <div class="tiles">
    <div class="card"><div class="tile-label">Uptime</div><div class="tile-value" id="t-uptime">—</div><div class="tile-sub" id="t-uptime-sub"></div></div>
    <div class="card"><div class="tile-label">Outages</div><div class="tile-value" id="t-outages">—</div><div class="tile-sub" id="t-outages-sub"></div></div>
    <div class="card"><div class="tile-label">Internet latency (median)</div><div class="tile-value" id="t-latency">—</div><div class="tile-sub" id="t-latency-sub"></div></div>
    <div class="card"><div class="tile-label">Ping loss</div><div class="tile-value" id="t-loss">—</div><div class="tile-sub" id="t-loss-sub"></div></div>
  </div>

  <section class="card">
    <div class="chart-head">
      <h2>Round-trip time (ms)</h2>
      <div class="legend">
        <span><i class="key-line" style="background:var(--series-1)"></i><span id="legend-internet">Internet</span></span>
        <span><i class="key-line" style="background:var(--series-2)"></i><span id="legend-router">Router</span></span>
        <span><i class="key-band" style="background:color-mix(in srgb, var(--critical) 25%, transparent)"></i>Offline</span>
        <span><i class="key-band" style="background:color-mix(in srgb, var(--warning) 30%, transparent)"></i>Degraded</span>
      </div>
    </div>
    <div class="chart-wrap">
      <svg id="chart" role="img" aria-label="Round-trip time over the selected range"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </section>

  <section class="card section">
    <h2>Outages, last 24 hours</h2>
    <div id="outages"></div>
  </section>

  <section class="card section">
    <details>
      <summary>Latest checks</summary>
      <div class="table-scroll" id="recent"></div>
    </details>
  </section>

  <footer id="footer"></footer>
</main>

<script>
(() => {
  'use strict';

  const LABELS = { up: 'Online', warn: 'Degraded', down: 'Offline', idle: 'Monitor not running' };
  const ICONS = { up: '✓', warn: '!', down: '✕', idle: '…' };

  let config = { tickMs: 3000, gapMs: 11000, pingHost: '1.1.1.1', httpUrl: '', httpEveryMs: 30000 };
  let gateway = null;
  let samples = [];
  let connected = false;
  let triedOnce = false; // true after the first connect attempt succeeds or fails
  let rangeMs = 3600000;
  try {
    const saved = Number(localStorage.getItem('netmon-range'));
    if (saved > 0) rangeMs = saved;
  } catch { /* storage unavailable */ }

  const $ = (id) => document.getElementById(id);

  // ---------- formatting ----------

  function fmtMs(v) {
    if (v == null) return '—';
    return v < 10 ? v.toFixed(1) : String(Math.round(v));
  }
  function fmtDur(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
    const h = Math.floor(m / 60);
    return `${h}h ${String(m % 60).padStart(2, '0')}m`;
  }
  function fmtTime(t, withSeconds = true) {
    return new Date(t).toLocaleTimeString([], withSeconds
      ? { hour: '2-digit', minute: '2-digit', second: '2-digit' }
      : { hour: '2-digit', minute: '2-digit' });
  }
  function fmtRange(ms) {
    return { 900000: '15 min', 3600000: '1 hour', 21600000: '6 hours', 86400000: '24 hours' }[ms] || fmtDur(ms);
  }
  function median(xs) {
    if (!xs.length) return null;
    const a = [...xs].sort((x, y) => x - y);
    const mid = a.length >> 1;
    return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
  }

  // ---------- derived data ----------

  const contiguous = (a, b) => b.t - a.t <= config.gapMs;

  function currentStatus() {
    const last = samples[samples.length - 1];
    if (!connected || !last || Date.now() - last.t > config.gapMs) return 'idle';
    return last.s;
  }

  // How long the current status has held, without crossing a gap in the record.
  function statusSince() {
    let i = samples.length - 1;
    if (i < 0) return null;
    const s = samples[i].s;
    while (i > 0 && samples[i - 1].s === s && contiguous(samples[i - 1], samples[i])) i--;
    return samples[i].t;
  }

  // Runs of "down" samples. An outage ends at the first sample that isn't down,
  // or at the last down sample plus one tick if the record stops there.
  function outages() {
    const list = [];
    let cur = null;
    for (let i = 0; i < samples.length; i++) {
      const x = samples[i];
      const prev = samples[i - 1];
      if (cur && prev && !contiguous(prev, x)) {
        cur.end = prev.t + config.tickMs;
        list.push(cur);
        cur = null;
      }
      if (x.s === 'down') {
        if (!cur) cur = { start: x.t, end: null, reasons: {} };
        if (x.r) cur.reasons[x.r] = (cur.reasons[x.r] || 0) + 1;
      } else if (cur) {
        cur.end = x.t;
        list.push(cur);
        cur = null;
      }
    }
    if (cur) {
      const last = samples[samples.length - 1];
      cur.ongoing = currentStatus() === 'down';
      cur.end = cur.ongoing ? Date.now() : last.t + config.tickMs;
      list.push(cur);
    }
    for (const o of list) {
      o.reason = Object.entries(o.reasons).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    }
    return list;
  }

  // ---------- rendering: hero and layers ----------

  function setLayer(id, ok, value, sub) {
    const el = $(id);
    el.dataset.ok = ok == null ? '' : ok ? '1' : '0';
    el.querySelector('.layer-value').textContent = value;
    el.querySelector('.layer-sub').textContent = sub;
  }

  function renderHero() {
    const status = currentStatus();
    const last = samples[samples.length - 1];
    $('hero').dataset.status = status;
    $('orb').textContent = ICONS[status];
    $('label').textContent = LABELS[status];

    if (status === 'idle' && !triedOnce) {
      $('label').textContent = 'Connecting…';
      $('reason').textContent = 'Waiting for the local monitor';
      $('since').textContent = '';
    } else if (status === 'idle') {
      $('reason').textContent = connected
        ? 'No checks are arriving. The monitor may have stopped (start it with: node monitor.ts), or the machine just woke from sleep.'
        : 'Can’t reach the monitor on localhost. Start it with: node monitor.ts';
      $('since').textContent = last ? `Last check ${fmtTime(last.t)}` : '';
    } else {
      $('reason').textContent = status === 'up' ? 'All checks passing' : (last.r || '');
      const since = statusSince();
      $('since').textContent = since ? `for ${fmtDur(Date.now() - since)}, since ${fmtTime(since, false)}` : '';
    }

    document.title = `${LABELS[status]} · Net Monitor`;
    setFavicon(status);

    if (!last || status === 'idle') {
      for (const id of ['layer-router', 'layer-internet', 'layer-dns', 'layer-web']) setLayer(id, null, '—', '');
      return;
    }
    if (last.g === undefined) setLayer('layer-router', false, 'No route', 'not on a network');
    else setLayer('layer-router', last.g !== null, last.g !== null ? `${fmtMs(last.g)} ms` : 'No reply', gateway || '');
    setLayer('layer-internet', last.n !== null, last.n !== null ? `${fmtMs(last.n)} ms` : 'No reply', config.pingHost);
    setLayer('layer-dns', last.d !== null, last.d !== null ? `${fmtMs(last.d)} ms` : 'No answer', 'uncached lookup');

    let web = null;
    for (let i = samples.length - 1; i >= 0; i--) {
      if ('h' in samples[i]) { web = samples[i]; break; }
    }
    if (!web) setLayer('layer-web', null, '—', 'not checked yet');
    else {
      const ago = `checked ${fmtDur(Date.now() - web.t)} ago`;
      if (web.p) setLayer('layer-web', false, 'Intercepted', ago);
      else setLayer('layer-web', web.h !== null, web.h !== null ? `${fmtMs(web.h)} ms` : 'Failed', ago);
    }
  }

  let lastFavicon = '';
  function setFavicon(status) {
    if (status === lastFavicon) return;
    lastFavicon = status;
    const css = getComputedStyle(document.documentElement);
    const color = { up: '--good', warn: '--warning', down: '--critical', idle: '--idle' }[status];
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const ctx = c.getContext('2d');
    ctx.fillStyle = css.getPropertyValue(color).trim();
    ctx.beginPath();
    ctx.arc(16, 16, 14, 0, Math.PI * 2);
    ctx.fill();
    $('favicon').href = c.toDataURL('image/png');
  }

  // ---------- rendering: tiles ----------

  function windowSamples() {
    const from = Date.now() - rangeMs;
    let i = samples.length;
    while (i > 0 && samples[i - 1].t >= from) i--;
    return samples.slice(i);
  }

  // When the time sample i stands for ends: at the next sample, one tick later if the
  // record stops there, or now for the latest sample while the monitor is running.
  // These are the same ends outages() uses, so the tiles agree with the outage table.
  function sampleEnd(i, now) {
    const x = samples[i];
    const next = samples[i + 1];
    if (next) return contiguous(x, next) ? next.t : x.t + config.tickMs;
    return currentStatus() !== 'idle' ? now : x.t + config.tickMs;
  }

  function renderTiles() {
    const win = windowSamples();
    const label = fmtRange(rangeMs);
    if (!win.length) {
      for (const id of ['t-uptime', 't-outages', 't-latency', 't-loss']) $(id).textContent = '—';
      for (const id of ['t-uptime-sub', 't-outages-sub', 't-latency-sub', 't-loss-sub']) $(id).textContent = `no checks in the last ${label}`;
      return;
    }
    // Uptime by time, not by sample count: rounds take longer during an outage
    // (checks wait for timeouts), so offline samples are sparser than online ones.
    // Start one sample before the window, whose time may run into it.
    const now = Date.now();
    const from = now - rangeMs;
    let observedMs = 0;
    let downMs = 0;
    for (let i = Math.max(0, samples.length - win.length - 1); i < samples.length; i++) {
      const span = Math.min(sampleEnd(i, now), now) - Math.max(samples[i].t, from);
      if (span <= 0) continue;
      observedMs += span;
      if (samples[i].s === 'down') downMs += span;
    }
    const up = observedMs ? ((observedMs - downMs) / observedMs) * 100 : 100;
    // Never round up to 100 when there was any downtime.
    setTile('t-uptime', !downMs ? '100' : up >= 99 ? Math.min(up, 99.99).toFixed(2) : up.toFixed(1), '%');
    $('t-uptime-sub').textContent = `${win.length.toLocaleString()} checks, last ${label}`;

    const outs = outages().filter((o) => o.end > from);
    setTile('t-outages', String(outs.length), '');
    $('t-outages-sub').textContent = outs.length ? `${fmtDur(downMs)} offline in total` : `none in the last ${label}`;

    const ns = win.map((x) => x.n).filter((v) => v !== null);
    const med = median(ns);
    setTile('t-latency', fmtMs(med), med == null ? '' : 'ms');
    const sorted = [...ns].sort((a, b) => a - b);
    $('t-latency-sub').textContent = sorted.length
      ? `95th percentile ${fmtMs(sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))])} ms`
      : 'no successful pings';

    const lost = win.filter((x) => x.n === null).length;
    const loss = (lost / win.length) * 100;
    setTile('t-loss', loss === 0 ? '0' : loss < 0.1 ? '<0.1' : loss.toFixed(1), '%');
    $('t-loss-sub').textContent = `${lost.toLocaleString()} of ${win.length.toLocaleString()} pings lost`;
  }

  function setTile(id, value, unit) {
    const el = $(id);
    el.textContent = value;
    if (unit) {
      const u = document.createElement('span');
      u.className = 'tile-unit';
      u.textContent = unit;
      el.appendChild(u);
    }
  }

  // ---------- rendering: chart ----------

  const SVGNS = 'http://www.w3.org/2000/svg';
  const STATUS_RANK = { up: 0, warn: 1, down: 2 };
  let buckets = [];
  let geom = null;

  function svgEl(name, attrs, parent) {
    const el = document.createElementNS(SVGNS, name);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  }

  function niceMax(v) {
    const steps = [10, 20, 25, 50, 100, 150, 200, 250, 500, 1000, 1500, 2000, 5000];
    for (const s of steps) if (v <= s) return s;
    return Math.ceil(v / 1000) * 1000;
  }

  function renderChart() {
    const svg = $('chart');
    const W = svg.clientWidth || 600;
    const H = svg.clientHeight || 240;
    const m = { l: 40, r: 8, t: 8, b: 22 };
    const pw = W - m.l - m.r;
    const ph = H - m.t - m.b;
    const now = Date.now();
    const start = now - rangeMs;

    // One bucket per ~3px, or per tick if that's coarser.
    const n = Math.max(1, Math.min(Math.floor(pw / 3), Math.ceil(rangeMs / config.tickMs)));
    const bms = rangeMs / n;
    buckets = Array.from({ length: n }, (_, i) => ({ t0: start + i * bms, t1: start + (i + 1) * bms, nSum: 0, nCnt: 0, gSum: 0, gCnt: 0, cnt: 0, worst: null, lost: 0 }));
    for (const x of windowSamples()) {
      const b = buckets[Math.min(n - 1, Math.floor((x.t - start) / bms))];
      b.cnt++;
      if (x.n !== null) { b.nSum += x.n; b.nCnt++; } else b.lost++;
      if (x.g != null) { b.gSum += x.g; b.gCnt++; }
      if (b.worst === null || STATUS_RANK[x.s] > STATUS_RANK[b.worst]) b.worst = x.s;
    }
    for (const b of buckets) {
      b.n = b.nCnt ? b.nSum / b.nCnt : null;
      b.g = b.gCnt ? b.gSum / b.gCnt : null;
    }

    let max = 0;
    for (const b of buckets) max = Math.max(max, b.n ?? 0, b.g ?? 0);
    const yMax = niceMax(Math.max(max * 1.1, 20));
    const x = (i) => m.l + (i + 0.5) * (pw / n);
    const y = (v) => m.t + ph - (Math.min(v, yMax) / yMax) * ph;
    geom = { m, pw, ph, n, W, H, x };

    svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    // status bands behind everything
    const bandW = pw / n;
    let i = 0;
    while (i < n) {
      const s = buckets[i].worst;
      if (s !== 'down' && s !== 'warn') { i++; continue; }
      let j = i;
      while (j + 1 < n && buckets[j + 1].worst === s) j++;
      svgEl('rect', {
        x: m.l + i * bandW, y: m.t, width: (j - i + 1) * bandW, height: ph,
        fill: s === 'down' ? 'color-mix(in srgb, var(--critical) 22%, transparent)' : 'color-mix(in srgb, var(--warning) 26%, transparent)',
      }, svg);
      i = j + 1;
    }

    // y grid + labels
    // 4 or 5 gridline steps, whichever lands on whole numbers (50 -> 10s, 100 -> 25s).
    const steps = yMax % 4 === 0 ? 4 : 5;
    for (let k = 0; k <= steps; k++) {
      const v = (yMax / steps) * k;
      const yy = y(v);
      svgEl('line', { x1: m.l, x2: m.l + pw, y1: yy, y2: yy, stroke: k === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }, svg);
      const t = svgEl('text', { x: m.l - 6, y: yy + 4, 'text-anchor': 'end' }, svg);
      t.textContent = String(Math.round(v));
    }

    // x labels: about one per 110px
    const ticks = Math.max(2, Math.floor(pw / 110));
    for (let k = 0; k <= ticks; k++) {
      const tt = start + (rangeMs / ticks) * k;
      const xx = m.l + (pw / ticks) * k;
      const t = svgEl('text', { x: xx, y: H - 6, 'text-anchor': k === 0 ? 'start' : k === ticks ? 'end' : 'middle' }, svg);
      t.textContent = k === ticks ? 'now' : fmtTime(tt, false);
    }

    // lines, broken wherever a bucket has no value
    const line = (key, color) => {
      let d = '';
      let pen = false;
      for (let k = 0; k < n; k++) {
        const v = buckets[k][key];
        if (v == null) { pen = false; continue; }
        d += `${pen ? 'L' : 'M'}${x(k).toFixed(1)},${y(v).toFixed(1)}`;
        pen = true;
      }
      if (d) svgEl('path', { d, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    };
    line('g', 'var(--series-2)');
    line('n', 'var(--series-1)');

    // crosshair (hidden until hover) and hit area
    geom.cross = svgEl('line', { x1: 0, x2: 0, y1: m.t, y2: m.t + ph, stroke: 'var(--muted)', 'stroke-width': 1, visibility: 'hidden' }, svg);
    geom.dotN = svgEl('circle', { r: 4, fill: 'var(--series-1)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' }, svg);
    geom.dotG = svgEl('circle', { r: 4, fill: 'var(--series-2)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' }, svg);
    geom.y = y;
    svgEl('rect', { x: m.l, y: 0, width: pw, height: H, fill: 'transparent' }, svg);

    if (hoverIndex !== null) showHover(hoverIndex);
  }

  // ---------- chart hover ----------

  let hoverIndex = null;
  const tip = $('tooltip');

  function tipRow(color, value, name) {
    const row = document.createElement('div');
    row.className = 'tt-row';
    if (color) {
      const k = document.createElement('i');
      k.className = 'key-line';
      k.style.background = color;
      row.appendChild(k);
    }
    const strong = document.createElement('strong');
    strong.textContent = value;
    const span = document.createElement('span');
    span.className = 'name';
    span.textContent = name;
    row.append(strong, span);
    return row;
  }

  function showHover(i) {
    if (!geom || i < 0 || i >= buckets.length) return hideHover();
    hoverIndex = i;
    const b = buckets[i];
    const xx = geom.x(i);
    geom.cross.setAttribute('x1', xx);
    geom.cross.setAttribute('x2', xx);
    geom.cross.setAttribute('visibility', 'visible');
    for (const [dot, v] of [[geom.dotN, b.n], [geom.dotG, b.g]]) {
      if (v == null) { dot.setAttribute('visibility', 'hidden'); continue; }
      dot.setAttribute('cx', xx);
      dot.setAttribute('cy', geom.y(v));
      dot.setAttribute('visibility', 'visible');
    }

    tip.replaceChildren();
    const time = document.createElement('div');
    time.className = 'tt-time';
    time.textContent = b.t1 - b.t0 > 90000 ? `${fmtTime(b.t0, false)} – ${fmtTime(b.t1, false)}` : `${fmtTime(b.t0)} – ${fmtTime(b.t1)}`;
    tip.appendChild(time);
    if (!b.cnt) {
      tip.appendChild(tipRow(null, 'No checks', '(monitor stopped or asleep)'));
    } else {
      tip.appendChild(tipRow('var(--series-1)', b.n == null ? 'no reply' : `${fmtMs(b.n)} ms`, 'Internet'));
      tip.appendChild(tipRow('var(--series-2)', b.g == null ? 'no reply' : `${fmtMs(b.g)} ms`, 'Router'));
      const st = tipRow(null, LABELS[b.worst], b.lost ? `${b.lost} of ${b.cnt} pings lost` : `${b.cnt} check${b.cnt === 1 ? '' : 's'}`);
      st.style.marginTop = '4px';
      tip.appendChild(st);
    }
    tip.style.display = 'block';
    const wrapW = $('chart').clientWidth;
    const tw = tip.offsetWidth;
    let left = xx + 12;
    if (left + tw > wrapW) left = xx - tw - 12;
    tip.style.left = `${Math.max(0, left)}px`;
    tip.style.top = `${geom.m.t}px`;
  }

  function hideHover() {
    hoverIndex = null;
    tip.style.display = 'none';
    if (geom) for (const el of [geom.cross, geom.dotN, geom.dotG]) el.setAttribute('visibility', 'hidden');
  }

  $('chart').addEventListener('pointermove', (e) => {
    if (!geom) return;
    const rect = $('chart').getBoundingClientRect();
    const px = (e.clientX - rect.left) * (geom.W / rect.width);
    if (px < geom.m.l || px > geom.m.l + geom.pw) return hideHover();
    showHover(Math.min(geom.n - 1, Math.max(0, Math.floor((px - geom.m.l) / (geom.pw / geom.n)))));
  });
  $('chart').addEventListener('pointerleave', hideHover);

  // ---------- rendering: tables ----------

  function cell(tr, text, status) {
    const td = document.createElement('td');
    if (status) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.dataset.s = status;
      b.textContent = text;
      td.appendChild(b);
    } else td.textContent = text;
    tr.appendChild(td);
  }

  function table(headers, rows) {
    const t = document.createElement('table');
    const head = t.createTHead().insertRow();
    for (const h of headers) {
      const th = document.createElement('th');
      th.textContent = h;
      head.appendChild(th);
    }
    const body = t.createTBody();
    for (const fill of rows) fill(body.insertRow());
    return t;
  }

  function renderOutages() {
    const list = outages().reverse();
    const box = $('outages');
    if (!list.length) {
      const p = document.createElement('div');
      p.className = 'empty';
      p.textContent = samples.length ? 'No outages recorded.' : 'No checks recorded yet.';
      box.replaceChildren(p);
      return;
    }
    box.replaceChildren(table(['Started', 'Duration', 'Likely cause'], list.map((o) => (tr) => {
      cell(tr, `${new Date(o.start).toLocaleDateString([], { weekday: 'short' })} ${fmtTime(o.start)}`, 'down');
      cell(tr, o.ongoing ? `${fmtDur(o.end - o.start)} (ongoing)` : fmtDur(o.end - o.start));
      cell(tr, o.reason);
    })));
  }

  function renderRecent() {
    const details = $('recent').closest('details');
    if (!details.open) return;
    const rows = samples.slice(-20).reverse();
    const v = (x) => (x === undefined ? '—' : x === null ? 'failed' : `${fmtMs(x)} ms`);
    $('recent').replaceChildren(table(['Time', 'Status', 'Router', 'Internet', 'DNS', 'Web'], rows.map((x) => (tr) => {
      cell(tr, fmtTime(x.t));
      cell(tr, LABELS[x.s], x.s);
      cell(tr, v(x.g));
      cell(tr, v(x.n));
      cell(tr, v(x.d));
      cell(tr, x.p ? 'intercepted' : v(x.h));
    })));
  }
  $('recent').closest('details').addEventListener('toggle', renderRecent);

  // ---------- wiring ----------

  function renderAll() {
    renderHero();
    renderTiles();
    renderChart();
    renderOutages();
    renderRecent();
    $('legend-internet').textContent = `Internet (${config.pingHost})`;
    $('legend-router').textContent = gateway ? `Router (${gateway})` : 'Router';
    $('footer').textContent = `Checks every ${config.tickMs / 1000}s: ping router and ${config.pingHost}, uncached DNS lookup, and an HTTP 204 check every ${config.httpEveryMs / 1000}s or whenever another check fails.`;
  }

  function setRange(ms) {
    rangeMs = ms;
    try { localStorage.setItem('netmon-range', String(ms)); } catch { /* ignore */ }
    for (const b of document.querySelectorAll('.filters button')) b.setAttribute('aria-pressed', String(Number(b.dataset.range) === ms));
    hideHover();
    renderAll();
  }
  for (const b of document.querySelectorAll('.filters button')) b.addEventListener('click', () => setRange(Number(b.dataset.range)));

  function connect() {
    const es = new EventSource('/events');
    es.addEventListener('init', (e) => {
      const data = JSON.parse(e.data);
      config = data.config;
      gateway = data.gateway;
      samples = data.samples;
      connected = true;
      triedOnce = true;
      renderAll();
    });
    es.addEventListener('sample', (e) => {
      const data = JSON.parse(e.data);
      gateway = data.gateway;
      samples.push(data.sample);
      const cutoff = Date.now() - 86400000;
      if (samples.length && samples[0].t < cutoff) samples = samples.filter((x) => x.t >= cutoff);
      renderAll();
    });
    es.addEventListener('error', () => {
      // EventSource retries on its own; just show that we're cut off meanwhile.
      connected = false;
      triedOnce = true;
      renderHero();
    });
  }

  new ResizeObserver(() => renderChart()).observe($('chart'));
  // Keep the "for 3m 12s" text and the stale-monitor check moving between samples.
  setInterval(renderHero, 1000);

  setRange(rangeMs);
  connect();
})();
</script>
</body>
</html>
